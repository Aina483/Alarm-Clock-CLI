[project]
name = "alarm-clock-python-cli"
version = "0.1.0"
description = "A CLI alarm clock application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alarm_clock"]

[project.scripts]
alarmclock = "alarm_clock.main:main"